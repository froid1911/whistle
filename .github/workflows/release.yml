name: Release

# Push a tag vX.Y.Z (after bumping the versions, see docs/RELEASING.md) to build
# the bridge binaries and the signed APK and publish them as a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the release signing certificate (public). The APK must be signed with it.
  WHISTLE_CERT_SHA256: cb3cb451e3504d372d8e199ea5456d3394392f989c0a77f427c7a4145eea6260

jobs:
  version:
    name: Check versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Versions match the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
          for f in herdr-plugin.toml bridge/plugin/herdr-plugin.toml; do
            m=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' "$f" | head -n 1)
            [ "$m" = "$version" ] || { echo "::error file=$f::plugin version $m != tag $version"; exit 1; }
          done
          a=$(sed -n 's/.*gradleProperty("whistleVersionName").orNull ?: "\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          [ "$a" = "$version" ] || { echo "::error file=android/app/build.gradle.kts::app version $a != tag $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bridge:
    name: Bridge binaries
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum
      - name: Test
        working-directory: bridge
        run: go test -race ./...
      - name: Build
        working-directory: bridge
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p ../dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="whistle-bridge_${VERSION}_${os}_${arch}"
            out="$RUNNER_TEMP/$name"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" -o "$out/whistle-bridge" ./cmd/whistle-bridge
            cp ../LICENSE ../THIRD_PARTY_NOTICES.md "$out/"
            tar -C "$out" --owner=0 --group=0 --numeric-owner -czf "../dist/$name.tar.gz" whistle-bridge LICENSE THIRD_PARTY_NOTICES.md
          done
          "$RUNNER_TEMP/whistle-bridge_${VERSION}_linux_amd64/whistle-bridge" version | grep -qx "whistle-bridge $VERSION"
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: bridge
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  android:
    name: Signed APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK packages
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          (yes || true) | "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WHISTLE_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::secret WHISTLE_KEYSTORE_BASE64 is not set"; exit 1; }
          ks="$RUNNER_TEMP/whistle-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          chmod 600 "$ks"
          echo "WHISTLE_KEYSTORE=$ks" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: android
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WHISTLE_KEYSTORE_PASSWORD: ${{ secrets.WHISTLE_KEYSTORE_PASSWORD }}
          WHISTLE_KEY_ALIAS: ${{ secrets.WHISTLE_KEY_ALIAS }}
          WHISTLE_KEY_PASSWORD: ${{ secrets.WHISTLE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease -PwhistleRequireSigning=true -PwhistleVersionName="$VERSION"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/whistle-release.jks"
      - name: Verify signature and version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$bt/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          # "Signer #1 certificate SHA-256 digest: …" or "V2 Signer: certificate SHA-256 digest: …"
          got=$(sed -n 's/^.*[Ss]igner.*certificate SHA-256 digest: *//p' "$RUNNER_TEMP/certs.txt" | sort -u)
          [ "$got" = "$WHISTLE_CERT_SHA256" ] || { echo "::error::APK signed with '$got', expected $WHISTLE_CERT_SHA256"; exit 1; }
          "$bt/aapt2" dump badging "$apk" | head -n 1 | grep -q "versionName='$VERSION'" || { echo "::error::APK versionName is not $VERSION"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/whistle-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub Release
    needs: [version, bridge, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum -- *.tar.gz *.apk > SHA256SUMS
          cat SHA256SUMS
          fp=$(echo "$WHISTLE_CERT_SHA256" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          **Android app**: download \`whistle-$VERSION.apk\` below and open it (allow installs from your browser once),
          or add \`https://github.com/froid1911/whistle\` to [Obtainium](https://github.com/ImranR98/Obtainium) to get updates.
          Whistle also checks for new releases itself (once a day, can be turned off in Settings).

          **herdr plugin** (Linux/macOS, no Go needed):

          \`\`\`sh
          herdr plugin install froid1911/whistle
          \`\`\`

          The install step downloads the matching \`whistle-bridge_${VERSION}_<os>_<arch>.tar.gz\` from this release
          and checks it against \`SHA256SUMS\`.

          ## Verify

          APK signing certificate SHA-256:
          \`$fp\`

          \`\`\`sh
          apksigner verify --print-certs whistle-$VERSION.apk
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`
          NOTES
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "Whistle $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
